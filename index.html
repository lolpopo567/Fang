<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5cff">
  <meta name="description" content="Live Thai captions, type-to-speak and a Thai Sign Language camera prototype for deaf and hard-of-hearing people.">
  <title>Fang ฟัง</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand"><span aria-hidden="true">👂</span> Fang <span class="brand-th">ฟัง</span></h1>
    <label class="lang-switch">
      <span class="sr-only" data-i18n="ui.language">ภาษา</span>
      <select id="ui-lang">
        <option value="th">ไทย</option>
        <option value="en">English</option>
      </select>
    </label>
  </header>

  <main>
    <!-- Live captions -->
    <section id="tab-captions" class="tab" role="tabpanel" aria-labelledby="nav-captions">
      <div class="notice" id="captions-unsupported" hidden data-i18n="captions.unsupported"></div>
      <div id="caption-box" class="caption-box" aria-live="polite" aria-atomic="false">
        <p class="placeholder" data-i18n="captions.placeholder"></p>
      </div>
      <div class="controls">
        <button id="caption-toggle" class="btn primary big" data-i18n="captions.start"></button>
        <label class="field">
          <span data-i18n="captions.speechLang"></span>
          <select id="caption-lang">
            <option value="th-TH">ไทย (th-TH)</option>
            <option value="en-US">English (en-US)</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="captions.textSize"></span>
          <input id="caption-size" type="range" min="20" max="72" value="34">
        </label>
      </div>
      <div class="controls">
        <button id="caption-copy" class="btn" data-i18n="captions.copy"></button>
        <button id="caption-save" class="btn" data-i18n="captions.save"></button>
        <button id="caption-clear" class="btn" data-i18n="captions.clear"></button>
      </div>
      <p class="status" id="caption-status" role="status"></p>
      <p class="fineprint" data-i18n="captions.privacy"></p>
    </section>

    <!-- Type to speak -->
    <section id="tab-speak" class="tab" role="tabpanel" aria-labelledby="nav-speak" hidden>
      <label class="field block">
        <span data-i18n="speak.label"></span>
        <textarea id="speak-text" rows="3"></textarea>
      </label>
      <div class="controls">
        <button id="speak-say" class="btn primary big" data-i18n="speak.say"></button>
        <button id="speak-show" class="btn big" data-i18n="speak.show"></button>
        <button id="speak-save" class="btn" data-i18n="speak.savePhrase"></button>
      </div>
      <p class="status" id="speak-status" role="status"></p>
      <h2 data-i18n="speak.phrases"></h2>
      <ul id="phrase-list" class="phrases"></ul>
    </section>

    <!-- Sign camera -->
    <section id="tab-sign" class="tab" role="tabpanel" aria-labelledby="nav-sign" hidden>
      <div class="notice warn" data-i18n="sign.prototype"></div>
      <div class="stage">
        <video id="sign-video" playsinline muted></video>
        <canvas id="sign-overlay"></canvas>
        <div class="stage-empty" id="stage-empty" data-i18n="sign.cameraOff"></div>
      </div>
      <div class="controls">
        <button id="sign-toggle" class="btn primary big" data-i18n="sign.start"></button>
        <button id="sign-flip" class="btn" data-i18n="sign.flip"></button>
        <label class="field">
          <span data-i18n="sign.mode"></span>
          <select id="sign-mode">
            <option value="offline" data-i18n="sign.modeOffline"></option>
            <option value="online" data-i18n="sign.modeOnline"></option>
            <option value="hybrid" data-i18n="sign.modeHybrid"></option>
          </select>
        </label>
      </div>
      <div class="field block" id="sign-endpoint-row" hidden>
        <label>
          <span data-i18n="sign.endpoint"></span>
          <input id="sign-endpoint" type="url" placeholder="https://example.org/api/recognize">
        </label>
      </div>
      <dl class="stats">
        <div><dt data-i18n="sign.statPipeline"></dt><dd id="stat-pipeline">—</dd></div>
        <div><dt data-i18n="sign.statHands"></dt><dd id="stat-hands">—</dd></div>
        <div><dt data-i18n="sign.statFps"></dt><dd id="stat-fps">—</dd></div>
        <div><dt data-i18n="sign.statLatency"></dt><dd id="stat-latency">—</dd></div>
      </dl>
      <div class="result" id="sign-result" aria-live="polite">
        <div class="result-label" id="result-label">—</div>
        <div class="result-meta" id="result-meta"></div>
      </div>

      <details class="recorder">
        <summary data-i18n="rec.title"></summary>
        <p class="fineprint" data-i18n="rec.help"></p>
        <div class="controls">
          <label class="field"><span data-i18n="rec.label"></span><input id="rec-label" type="text"></label>
          <label class="field"><span data-i18n="rec.signer"></span><input id="rec-signer" type="text" autocomplete="off"></label>
          <button id="rec-start" class="btn" data-i18n="rec.record"></button>
          <button id="rec-export" class="btn" data-i18n="rec.export"></button>
          <button id="rec-clear" class="btn" data-i18n="rec.clear"></button>
        </div>
        <p class="status" id="rec-status" role="status"></p>
      </details>
    </section>
  </main>

  <nav class="tabbar" role="tablist">
    <button id="nav-captions" role="tab" data-tab="tab-captions" aria-selected="true"><span aria-hidden="true">💬</span><span data-i18n="nav.captions"></span></button>
    <button id="nav-speak" role="tab" data-tab="tab-speak" aria-selected="false"><span aria-hidden="true">⌨️</span><span data-i18n="nav.speak"></span></button>
    <button id="nav-sign" role="tab" data-tab="tab-sign" aria-selected="false"><span aria-hidden="true">🤟</span><span data-i18n="nav.sign"></span></button>
  </nav>

  <div id="bigtext" class="bigtext" hidden role="dialog" aria-modal="true">
    <p id="bigtext-content"></p>
    <button id="bigtext-close" class="btn" data-i18n="speak.close"></button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'models/**', 'js/**', 'css/icons.css', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'models/**', 'js/**', 'css/icons.css', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      # Text, icons and the parity fixture are generated from the web app; fail if they are out of date.
      - name: Generated files are up to date
        run: |
          node tools/gen-strings.mjs
          node tools/gen-icons.mjs
          node tools/make-parity-fixture.mjs
          git diff --exit-code
      - name: Unit tests (sign model parity, screens render)
        run: ./gradlew testDebugUnitTest
      - name: Build APK
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: fang-android-apk
          path: android/app/build/outputs/apk/release/*.apk
